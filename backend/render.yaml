services:
  - type: web
    name: wanderrag-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: wanderrag-tourism
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wanderrag-db
          property: connectionString

databases:
  - name: wanderrag-db
    databaseName: wanderrag
    user: wanderrag_user
    plan: free